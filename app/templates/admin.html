<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>运营管理后台</title>
    <!-- 引入漂亮的 Bootstrap 样式 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; padding: 30px; font-family: sans-serif; }
        .card { border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .table th { background-color: #2c3e50; color: white; border: none;}
        .table td { vertical-align: middle; }
    </style>
</head>
<body>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>📊 校园售货机 - 监控中心</h1>
            <button class="btn btn-primary" onclick="location.reload()">🔄 刷新数据</button>
        </div>

        <!-- 销售统计卡片 -->
        <div class="card p-4 mb-4">
            <h5 class="text-muted">💰 今日总销售额</h5>
            <h1 class="display-4 text-success fw-bold">¥ {{ total_sales }}</h1>
        </div>

        <!-- 库存列表 -->
        <div class="card p-4">
            <h4>📦 库存与设备监控</h4>
            <table class="table table-hover mt-3">
                <thead>
                    <tr>
                        <th>商品ID</th>
                        <th>商品</th>
                        <th>名称</th>
                        <th>单价</th>
                        <th>当前库存</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    {% for p in machines %}
                    <tr>
                        <td>#{{ p.id }}</td>
                        <td style="font-size: 1.5rem;">{{ p.image }}</td>
                        <td class="fw-bold">{{ p.name }}</td>
                        <td>¥ {{ p.price }}</td>
                        <td>
                            <!-- 库存少于5个显示红色警告 -->
                            {% if p.stock < 5 %}
                                <span class="badge bg-danger rounded-pill">库存紧张: {{ p.stock }}</span>
                            {% else %}
                                <span class="badge bg-success rounded-pill">充足: {{ p.stock }}</span>
                            {% endif %}
                        </td>
                        <td>
                            <!-- 这里是真正的补货按钮，不再是弹窗了 -->
                            <button class="btn btn-sm btn-outline-primary" onclick="refill({{ p.id }})">
                                ⚡ 一键补满
                            </button>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <!-- 核心逻辑：调用后端接口 -->
    <script>
        async function refill(pid) {
            // 1. 再次确认防止误触
            if (!confirm("确定要将该商品库存补满到 20 吗？")) return;

            try {
                // 2. 向后端发送请求
                const res = await fetch('/api/refill', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        product_id: pid,
                        amount: 20
                    })
                });

                const data = await res.json();

                // 3. 处理结果
                if (res.ok) {
                    alert("✅ " + data.msg); // 成功提示
                    location.reload();       // 刷新页面看最新库存
                } else {
                    alert("❌ 失败: " + data.detail);
                }
            } catch (e) {
                alert("无法连接服务器");
            }
        }
    </script>
</body>
</html>
